<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="退款联合签名">
  <title>退款联合签名</title>
  <link rel="stylesheet" href="style.css?v=2">
  <script type="module" src="app.js?v=2"></script>
</head>
<body>
  <main>
    <header>
      <h1>退款联合签名</h1>
      <button id="connect">连接钱包</button>
    </header>
    <p id="wallet" class="wallet" hidden></p>

    <section class="overview" aria-label="退款信息">
      <div>
        <p class="amount-label">退款金额</p>
        <div class="amount">0.4 <small>BNB</small></div>
      </div>
      <dl class="addresses">
        <div><dt>指定收款地址</dt><dd><a id="recipient" target="_blank" rel="noopener"></a></dd></div>
        <div><dt>原私募地址</dt><dd><a id="investor" target="_blank" rel="noopener"></a></dd></div>
      </dl>
    </section>

    <section class="steps" aria-label="退款操作">
      <article>
        <span class="step" aria-hidden="true">01</span>
        <h2>管理员申请提现</h2>
        <button id="create" disabled>创建申请</button>
      </article>
      <article>
        <span class="step" aria-hidden="true">02</span>
        <h2>三位管理员分别确认</h2>
        <button id="confirm" disabled>确认申请</button>
      </article>
      <article>
        <span class="step" aria-hidden="true">03</span>
        <button id="execute" disabled>管理员执行退款 · 0.4 BNB</button>
      </article>
    </section>
    <p id="feedback" role="status" aria-live="polite"></p>

    <section class="panel" aria-label="签名人">
      <div class="panel-actions"><button class="secondary" id="refresh">刷新状态</button></div>
      <div id="signers"></div>
    </section>
  </main>

  <dialog id="review">
    <form method="dialog">
      <h2 id="reviewTitle"></h2>
      <div id="reviewBody"></div>
      <div class="dialogActions">
        <button value="cancel" class="secondary" autofocus>取消</button>
        <button value="send">打开钱包确认</button>
      </div>
    </form>
  </dialog>
</body>
</html>
