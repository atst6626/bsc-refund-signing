<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>私募退款 · 合伙人确认</title>
  <link rel="stylesheet" href="style.css?v=partner-compact">
  <script type="module" src="app.js?v=partner-compact"></script>
</head>
<body>
  <main class="partner-page">
    <header>
      <button id="connect" type="button">连接签名钱包</button>
    </header>

    <section class="panel" aria-labelledby="refund-heading">
      <div class="sectionhead">
        <div>
          <h2 id="refund-heading">本批退款明细</h2>
          <span class="refund-count">共 32 笔</span>
        </div>
        <button id="refresh" class="secondary" type="button">刷新状态</button>
      </div>
      <p id="wallet" class="refund-status" hidden></p>
      <p id="read-status" class="refund-status" role="status" aria-live="polite">正在读取退款明细…</p>
      <p id="activity" class="refund-status" role="status" aria-live="polite"></p>
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th scope="col">序号</th>
              <th scope="col">原地址／收款地址</th>
              <th scope="col">份数</th>
              <th scope="col">退款 BNB</th>
              <th scope="col">申请号</th>
              <th scope="col">进度</th>
              <th scope="col">操作</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="review" aria-labelledby="review-heading">
    <form method="dialog">
      <span class="eyebrow">确认前请核对</span>
      <h2 id="review-heading">同意这笔退款申请</h2>
      <div id="reviewBody"></div>
      <div class="dialogActions">
        <button value="cancel" class="secondary">取消</button>
        <button value="send">打开钱包确认</button>
      </div>
    </form>
  </dialog>
</body>
</html>
